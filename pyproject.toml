[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-violence-pipeline"
version = "0.1.0"
description = "Pipeline de estimativa de pose YOLOv8 com detecção de violência (placeholder) e integração S3."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Seu time" }]
dependencies = [
  "boto3>=1.34.0",
  "numpy>=1.24.0",
]

[project.optional-dependencies]
runtime = [
  "opencv-python-headless>=4.8.0",
  "ultralytics>=8.1.0",
]
transcribe = [
  "openai>=1.40.0",
  "reportlab>=4.1.0",
]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.4.0",
  "openai>=1.40.0",
  "reportlab>=4.1.0",
]

[project.scripts]
yolo-violence = "yolo_violence_pipeline.cli:main"
yolo-transcribe = "yolo_violence_pipeline.transcribe_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
