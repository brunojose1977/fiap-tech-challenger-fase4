# Dispara apenas manualmente (Actions → "RUN pipeline no Fargate" → Run workflow).
# Evita o job aparecer como "skipped" no CI de push/PR.
name: RUN pipeline no Fargate

on:
  workflow_dispatch:
    inputs:
      push_to_ecr:
        description: "Buildar e enviar imagem :latest para o ECR antes do RunTask"
        type: boolean
        default: true
      s3_input_key:
        description: "Chave S3 do vídeo no bucket de entrada (vazio = meu_video_04.mp4)"
        type: string
        default: ""

concurrency:
  group: run-fargate-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  DEFAULT_S3_INPUT_KEY: meu_video_04.mp4

jobs:
  push-image:
    if: inputs.push_to_ecr == true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Configurar credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO_NAME: ${{ secrets.ECR_REPOSITORY_NAME }}
        run: |
          test -n "$REPO_NAME" || (echo "Secret ECR_REPOSITORY_NAME ausente." && exit 1)
          docker build -t "$ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG" -t "$ECR_REGISTRY/$REPO_NAME:latest" .
          docker push "$ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$REPO_NAME:latest"

  run-ecs-fargate:
    name: RUN — pipeline Python no Fargate
    needs: [push-image]
    if: |
      always() &&
      (needs.push-image.result == 'success' || needs.push-image.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER_NAME }}
      ECS_TASK_DEFINITION: ${{ secrets.ECS_TASK_DEFINITION_FAMILY }}
      ECS_CONTAINER_NAME: ${{ secrets.ECS_CONTAINER_NAME }}
      SUBNET_IDS: ${{ secrets.ECS_SUBNET_IDS }}
      SECURITY_GROUP_ID: ${{ secrets.ECS_SECURITY_GROUP_ID }}
      S3_INPUT_KEY: ${{ inputs.s3_input_key || 'meu_video_04.mp4' }}
    steps:
      - name: Configurar credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validar secrets do RunTask
        run: |
          if [ -z "${S3_INPUT_KEY}" ]; then
            S3_INPUT_KEY="${DEFAULT_S3_INPUT_KEY}"
            echo "S3_INPUT_KEY=${S3_INPUT_KEY}" >> "$GITHUB_ENV"
          fi
          for name in ECS_CLUSTER ECS_TASK_DEFINITION ECS_CONTAINER_NAME SUBNET_IDS SECURITY_GROUP_ID; do
            eval "value=\$$name"
            if [ -z "$value" ]; then
              echo "Secret ausente para RunTask: $name"
              exit 1
            fi
          done
          echo "S3_INPUT_KEY=${S3_INPUT_KEY}"

      - name: Validar rede (subnets, SG e rota para Internet)
        run: |
          set -euo pipefail
          SUBNET_LIST=$(echo "$SUBNET_IDS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d')
          SG_VPC=$(aws ec2 describe-security-groups \
            --region "$AWS_REGION" \
            --group-ids "$SECURITY_GROUP_ID" \
            --query "SecurityGroups[0].VpcId" \
            --output text)

          echo "Security group VPC: ${SG_VPC}"
          while IFS= read -r subnet; do
            [ -n "$subnet" ] || continue
            SUBNET_VPC=$(aws ec2 describe-subnets \
              --region "$AWS_REGION" \
              --subnet-ids "$subnet" \
              --query "Subnets[0].VpcId" \
              --output text)
            if [ "$SUBNET_VPC" != "$SG_VPC" ]; then
              echo "Subnet ${subnet} (VPC ${SUBNET_VPC}) não pertence à VPC do security group (${SG_VPC})."
              echo "Atualize o secret ECS_SUBNET_IDS com: terraform output -raw ecs_subnet_ids_csv"
              exit 1
            fi
            IGW_ROUTE=$(aws ec2 describe-route-tables \
              --region "$AWS_REGION" \
              --filters "Name=association.subnet-id,Values=${subnet}" \
              --query "RouteTables[0].Routes[?DestinationCidrBlock=='0.0.0.0/0'].GatewayId | [0]" \
              --output text)
            if [ -z "$IGW_ROUTE" ] || [ "$IGW_ROUTE" = "None" ] || [[ "$IGW_ROUTE" != igw-* ]]; then
              echo "Subnet ${subnet} não tem rota 0.0.0.0/0 para Internet Gateway (necessário para Fargate baixar imagem do ECR)."
              exit 1
            fi
            echo "Subnet OK: ${subnet} (VPC ${SUBNET_VPC}, IGW ${IGW_ROUTE})"
          done <<< "$SUBNET_LIST"

      - name: RunTask ECS Fargate e aguardar conclusão
        env:
          PENDING_TIMEOUT_SEC: 1200
          STUCK_STATUS_SEC: 600
        run: |
          set -euo pipefail
          SUBNETS_JSON=$(echo "$SUBNET_IDS" | jq -R 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          NETWORK_CONFIG=$(jq -n \
            --argjson subnets "$SUBNETS_JSON" \
            --arg sg "$SECURITY_GROUP_ID" \
            '{awsvpcConfiguration: {subnets: $subnets, securityGroups: [$sg], assignPublicIp: "ENABLED"}}')
          OVERRIDES=$(jq -n \
            --arg name "$ECS_CONTAINER_NAME" \
            --arg key "$S3_INPUT_KEY" \
            '{containerOverrides: [{name: $name, environment: [{name: "S3_INPUT_KEY", value: $key}]}]}')

          RUN_JSON=$(aws ecs run-task \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$ECS_TASK_DEFINITION" \
            --network-configuration "$NETWORK_CONFIG" \
            --overrides "$OVERRIDES" \
            --output json)

          if [ "$(echo "$RUN_JSON" | jq '.failures | length')" -gt 0 ]; then
            echo "RunTask retornou falhas:"
            echo "$RUN_JSON" | jq '.failures'
            exit 1
          fi

          TASK_ARN=$(echo "$RUN_JSON" | jq -r '.tasks[0].taskArn // empty')
          if [ -z "$TASK_ARN" ]; then
            echo "RunTask não retornou taskArn:"
            echo "$RUN_JSON" | jq .
            exit 1
          fi
          echo "Task ARN: $TASK_ARN"

          START_TS=$(date +%s)
          LAST_STATUS=""
          STATUS_SINCE=$START_TS

          echo "Aguardando conclusão da tarefa (timeout em PENDING/PROVISIONING: ${PENDING_TIMEOUT_SEC}s)..."
          while true; do
            sleep 15
            TASK_JSON=$(aws ecs describe-tasks \
              --region "$AWS_REGION" \
              --cluster "$ECS_CLUSTER" \
              --tasks "$TASK_ARN" \
              --output json)

            if [ "$(echo "$TASK_JSON" | jq '.tasks | length')" -eq 0 ]; then
              echo "Tarefa não encontrada no cluster ${ECS_CLUSTER}. Verifique ECS_CLUSTER_NAME e a região ${AWS_REGION}."
              exit 1
            fi

            TASK_STATUS=$(echo "$TASK_JSON" | jq -r '.tasks[0].lastStatus')
            DESIRED_STATUS=$(echo "$TASK_JSON" | jq -r '.tasks[0].desiredStatus')
            EXIT_CODE=$(echo "$TASK_JSON" | jq -r '.tasks[0].containers[0].exitCode // "None"')
            STOP_REASON=$(echo "$TASK_JSON" | jq -r '.tasks[0].stoppedReason // empty')
            STOP_CODE=$(echo "$TASK_JSON" | jq -r '.tasks[0].stopCode // empty')
            CONTAINER_STATUS=$(echo "$TASK_JSON" | jq -r '.tasks[0].containers[0].lastStatus // empty')
            CONTAINER_REASON=$(echo "$TASK_JSON" | jq -r '.tasks[0].containers[0].reason // empty')

            echo "Status: ${TASK_STATUS} (desired: ${DESIRED_STATUS})  Container: ${CONTAINER_STATUS}  ExitCode: ${EXIT_CODE}"
            [ -n "$CONTAINER_REASON" ] && [ "$CONTAINER_REASON" != "null" ] && echo "Container reason: ${CONTAINER_REASON}"
            [ -n "$STOP_REASON" ] && [ "$STOP_REASON" != "null" ] && echo "Stopped reason: ${STOP_REASON}"
            [ -n "$STOP_CODE" ] && [ "$STOP_CODE" != "null" ] && echo "Stop code: ${STOP_CODE}"

            NOW_TS=$(date +%s)
            if [ "$TASK_STATUS" != "$LAST_STATUS" ]; then
              LAST_STATUS=$TASK_STATUS
              STATUS_SINCE=$NOW_TS
            fi

            case "$TASK_STATUS" in
              RUNNING)
                continue
                ;;
              PENDING|PROVISIONING)
                ELAPSED=$((NOW_TS - START_TS))
                STUCK=$((NOW_TS - STATUS_SINCE))
                if [ "$ELAPSED" -ge "$PENDING_TIMEOUT_SEC" ] || [ "$STUCK" -ge "$STUCK_STATUS_SEC" ]; then
                  echo "Timeout: tarefa presa em ${TASK_STATUS}."
                  echo "Atualize os secrets com os outputs do Terraform (principalmente ECS_SUBNET_IDS):"
                  echo "  terraform output -raw ecs_subnet_ids_csv"
                  echo "  terraform output -raw ecs_task_security_group_id"
                  echo "$TASK_JSON" | jq '.tasks[0] | {lastStatus, desiredStatus, stoppedReason, stopCode, containers, attachments}'
                  exit 1
                fi
                continue
                ;;
              STOPPED)
                if [ "$EXIT_CODE" != "0" ] && [ "$EXIT_CODE" != "None" ] && [ -n "$EXIT_CODE" ]; then
                  echo "Tarefa finalizou com erro. ExitCode=${EXIT_CODE} Motivo=${STOP_REASON}"
                  exit 1
                fi
                echo "Pipeline concluído com sucesso."
                exit 0
                ;;
              *)
                echo "Status inesperado: ${TASK_STATUS}"
                echo "$TASK_JSON" | jq '.tasks[0]'
                exit 1
                ;;
            esac
          done
