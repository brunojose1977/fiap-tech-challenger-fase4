name: CI e CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      push_to_ecr:
        description: "Fazer login na AWS, buildar e enviar a imagem para o ECR"
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,transcribe]"

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest -q --tb=short

  docker-build:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build da imagem (validação)
        run: docker build -t yolo-violence:ci .

  terraform-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      # terraform.tfvars é específico do ambiente; o CI valida apenas os .tf versionados.
      - name: Terraform fmt
        run: |
          for f in *.tf; do
            terraform fmt -check -diff=false "$f"
          done

      - name: Terraform init (sem backend remoto)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

  publish-ecr:
    needs: [lint-test, docker-build]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.push_to_ecr == true)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Configurar credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO_NAME: ${{ secrets.ECR_REPOSITORY_NAME }}
        run: |
          test -n "$REPO_NAME" || (echo "Secret ECR_REPOSITORY_NAME ausente." && exit 1)
          docker build -t "$ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG" -t "$ECR_REGISTRY/$REPO_NAME:latest" .
          docker push "$ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$REPO_NAME:latest"

# Processamento no Fargate: use o workflow "RUN pipeline no Fargate" (run-fargate.yml).
