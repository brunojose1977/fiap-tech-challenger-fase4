# Pipeline: aws-transcribe-audio-from-video-conversations
# Transcreve mídias do S3 (Amazon Transcribe) e gera avaliação de risco em PDF (OpenAI).
name: aws-transcribe-audio-from-video-conversations

on:
  workflow_dispatch:
    inputs:
      skip_existing:
        description: "Pular arquivos que já possuem TXT e PDF no bucket de saída"
        type: boolean
        default: true

concurrency:
  group: transcribe-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TRANSCRIBE_S3_INPUT_BUCKET: transcribe-violence-input-fiap-posttech-iadevs-tcfase04
  TRANSCRIBE_S3_OUTPUT_BUCKET: transcribe-violence-output-fiap-posttech-iadevs-tcfase0
  OPENAI_MODEL: gpt-5.4
  TRANSCRIBE_LANGUAGE_CODE: pt-BR

jobs:
  transcribe-and-analyze:
    name: Transcribe + ChatGPT risk PDF
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências (fluxo Transcribe)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,transcribe]"

      - name: Configurar credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validar secrets obrigatórios
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || (echo "Secret OPENAI_API_KEY ausente." && exit 1)
          test -n "${{ secrets.AWS_ROLE_ARN }}" || (echo "Secret AWS_ROLE_ARN ausente." && exit 1)

      - name: Executar aws-transcribe-audio-from-video-conversations
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SKIP_EXISTING_OUTPUTS: ${{ inputs.skip_existing }}
          WORK_DIR: /tmp/transcribe-work
        run: |
          yolo-violence transcribe-analyze --log-level INFO
